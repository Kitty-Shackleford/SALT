name: Piper — Release builder

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (optional; omit to build without creating a release)
        required: false
      push_images:
        description: Push built images when registry credentials are configured
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dayz-dashboard
      IMAGE_TAG: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Invalid Docker image tag"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check registry configuration
        id: registry-config
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Registry credentials are not configured; images will be built without pushing."
          fi

      - name: Login to registry
        if: steps.registry-config.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.push_images)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and optionally push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.registry-config.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.push_images) }}
          tags: ${{ steps.registry-config.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.push_images) && format('{0}/{1}:{2}', secrets.DOCKER_USERNAME, env.IMAGE_NAME, env.IMAGE_TAG) || format('{0}:{1}', env.IMAGE_NAME, env.IMAGE_TAG) }}

      - name: Build and optionally push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bot
          push: ${{ steps.registry-config.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.push_images) }}
          tags: ${{ steps.registry-config.outputs.configured == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.push_images) && format('{0}/{1}-bot:{2}', secrets.DOCKER_USERNAME, env.IMAGE_NAME, env.IMAGE_TAG) || format('{0}-bot:{1}', env.IMAGE_NAME, env.IMAGE_TAG) }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
