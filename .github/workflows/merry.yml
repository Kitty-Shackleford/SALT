name: Merry — Changelog generator

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Merry changelog generator
        run: |
          node scripts/merry-changelog.js

      - name: Upload generated changelog
        uses: actions/upload-artifact@v4
        with:
          name: merry-changelog-${{ github.sha }}
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 14
