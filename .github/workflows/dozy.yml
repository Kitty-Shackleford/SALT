name: Dozy — Performance profiler

on:
  schedule:
    - cron: '0 2 * * 2' # weekly on Tuesdays at 02:00 UTC
  workflow_dispatch: {}

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Dozy profiler
        env:
          ENDPOINTS: "http://localhost:8080/"
          TIMEOUT_MS: 8000
          THRESHOLD_MS: 800
        run: |
          node scripts/dozy-profile.js
