name: CI

on: [push, pull_request]

jobs:
  quick:
    name: Lint + security + audit (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use supported npm audit client
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix bot
      - name: Dependency review (blocks new vulnerable/unlicensed deps at merge time)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Lint
        run: npm run lint
      - name: Syntax check
        run: |
          node --check server.js
          node --check scripts/orchestrator.js
      - name: Secret audit
        run: npm run security:audit
      - name: Performance gate (Dozy — static asset response times)
        run: |
          python3 -m http.server 8080 --directory public >/tmp/dozy-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/css/theme.css >/dev/null; then break; fi
            sleep 1
          done
          ENDPOINTS="http://127.0.0.1:8080/css/theme.css,http://127.0.0.1:8080/js/dashboard.js" \
          TIMEOUT_MS=8000 THRESHOLD_MS=2000 \
          node scripts/dozy-profile.js
      - name: npm audit (production dependencies — release gate)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (full tree — informational, non-blocking)
        run: |
          npm audit --audit-level=high || echo "::warning::Dev-only dependencies have known issues; prod install (--omit=dev) is clean."

  tests:
    name: Unit + integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dayz-dashboard-test
          POSTGRES_USER: dayz-dashboard
          POSTGRES_PASSWORD: dayz-dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayz-dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix bot
      - name: Run unit tests
        env:
          FINANCIAL_IDEMPOTENCY_PG_TEST_DATABASE: postgres://dayz-dashboard:dayz-dashboard@127.0.0.1:5432/dayz-dashboard-test
          FINANCIAL_RETENTION_PG_TEST_DATABASE: postgres://dayz-dashboard:dayz-dashboard@127.0.0.1:5432/dayz-dashboard-test
          PROVIDER_MUTATION_PG_TEST_DATABASE: postgres://dayz-dashboard:dayz-dashboard@127.0.0.1:5432/dayz-dashboard-test
        run: ENCRYPTION_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))") npm test
      - name: Database smoke test
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: dayz-dashboard-test
          POSTGRES_USER: dayz-dashboard
          POSTGRES_PASSWORD: dayz-dashboard
        run: npm run db:smoke-test
