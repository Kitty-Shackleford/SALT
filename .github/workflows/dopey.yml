name: Dopey — UI smoke tester

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y >/dev/null || true
          npm i -D playwright@1.62.1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start static server and run Dopey smoke tests
        env:
          BASE_URL: http://localhost:8080
          PAGES: "/,/admin"
        run: |
          python3 -m http.server 8080 --directory public >/tmp/dopey-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://localhost:8080/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/dopey-http.log
            exit 1
          fi
          node scripts/dopey-smoke.js
