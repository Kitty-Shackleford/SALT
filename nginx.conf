# Example reverse-proxy configuration. Replace the example hostnames and
# certificate paths for your deployment before enabling this file.
server {
    listen 80;
    server_name dashboard.example.com player.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashboard.example.com player.example.com;

    ssl_certificate     /etc/nginx/ssl/dashboard.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/dashboard.example.com.key;

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
