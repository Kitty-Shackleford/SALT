<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nitrado Settings - DayZ Dashboard</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <script src="/js/instance-config.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="container mx-auto p-6 max-w-7xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-4xl font-bold">⚙️ Nitrado Server Settings</h1>
      <a href="/dashboard" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">← Back</a>
    </div>

    <!-- Server Selection -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
      <label class="block mb-2 font-semibold">Select Server:</label>
      <select id="serverSelect" class="bg-gray-700 p-3 rounded w-full text-lg">
        <option value="">-- Choose a server --</option>
      </select>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="text-center py-12 hidden">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-white"></div>
      <p class="mt-4 text-gray-400">Loading settings...</p>
    </div>

    <!-- Settings Container -->
    <div id="settingsContainer" class="hidden">

      <!-- General Settings -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-2xl mb-4 font-bold">🔧 General Settings</h2>
        <div id="generalSettings" class="space-y-4"></div>
      </div>

      <!-- Config Settings -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-2xl mb-4 font-bold">📋 Config Settings</h2>
        <div id="configSettings" class="space-y-4"></div>
      </div>

      <!-- Savegame Settings -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-2xl mb-4 font-bold">💾 Savegame Settings</h2>
        <div id="savegameSettings" class="space-y-4"></div>
      </div>

      <!-- Save Button -->
      <div class="flex justify-end gap-4">
        <button id="resetBtn" class="bg-gray-600 hover:bg-gray-700 px-6 py-3 rounded-lg text-lg">
          Reset Changes
        </button>
        <button id="saveBtn" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg text-lg font-semibold">
          💾 Save All Changes
        </button>
      </div>
    </div>

    <!-- No Server Selected Message -->
    <div id="noServerMessage" class="text-center py-12 text-gray-400">
      <p class="text-xl">Please select a server to view and edit settings</p>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/csrf-helper.js"></script>
  <script src="/js/nitrado-settings.js"></script>
</body>
</html>
