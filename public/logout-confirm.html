<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign out — S.A.L.T.</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/logout-confirm.js" defer></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center p-6">
  <main class="w-full max-w-md rounded-lg border border-gray-700 bg-gray-900 p-6 shadow-xl">
    <h1 class="mb-3 text-2xl font-semibold">Sign out</h1>
    <p class="mb-6 text-gray-300">Confirm that you want to end this session.</p>
    <form method="post" action="/logout" class="flex gap-3">
      <input id="logoutCsrfToken" type="hidden" name="_csrf" value="">
      <button type="submit" class="rounded bg-red-600 px-4 py-2 font-medium hover:bg-red-700">Sign out</button>
      <a href="/dashboard" class="rounded bg-gray-700 px-4 py-2 font-medium hover:bg-gray-600">Cancel</a>
    </form>
  </main>
</body>
</html>
