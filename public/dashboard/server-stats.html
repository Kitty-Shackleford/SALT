<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Server Stats - DayZ Dashboard</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <!-- Chart.js loaded from CDN — no build step required -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
  <script src="/js/instance-config.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="container mx-auto p-6 max-w-7xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-4xl font-bold">📊 Server Stats</h1>
      <a href="/dashboard" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">← Back</a>
    </div>

    <!-- Dashboard Navigation -->
    <nav class="bg-gray-800 rounded-lg p-3 mb-6 border border-gray-700">
      <div class="flex gap-2 flex-wrap">
        <a href="/dashboard" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🎮 Servers</a>
        <a href="/dashboard/economy" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">💰 Economy</a>
        <a href="/map" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🗺️ Map</a>
        <a href="/dashboard/feeds" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">📢 Feeds</a>
        <a href="/dashboard/automation" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">⚙️ Automation</a>
        <a href="/dashboard/tasks" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🕒 Tasks</a>
        <a href="/dashboard/server-control" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🎮 Control</a>
        <a href="/dashboard/backups" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">💾 Backups</a>
        <a href="/dashboard/rotation" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🔄 Rotation</a>
        <a href="/dashboard/ai-assistant" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🤖 AI</a>
        <a href="/dashboard/server-stats" class="bg-blue-600 px-4 py-2 rounded font-semibold">📊 Stats</a>
        <a href="/dashboard/activity-log" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">📋 Activity</a>
        <a href="/dashboard/console" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🖥️ Console</a>
        <a href="/dashboard/boost" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🚀 Boost</a>
        <a href="/dashboard/support" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🎫 Support</a>
        <a href="/dashboard/settings" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🔧 Settings</a>
        <a href="/player-portal" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">👤 Player Portal</a>
        <a href="/dashboard/shop-admin" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🛒 Shop</a>
      </div>
    </nav>

    <!-- Server selector + time range -->
    <div class="bg-gray-800 p-4 rounded-lg mb-6 border border-gray-700 flex flex-wrap gap-4 items-end">
      <div class="flex-1 min-w-48">
        <label class="block mb-2 font-semibold">Select Server</label>
        <select id="serverSelect" class="bg-gray-700 p-2 rounded w-full">
          <option value="">Loading servers…</option>
        </select>
      </div>
      <div>
        <label class="block mb-2 font-semibold">Time Range</label>
        <div class="flex gap-2">
          <button data-hours="6"  class="range-btn bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-sm">6h</button>
          <button data-hours="12" class="range-btn bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-sm">12h</button>
          <button data-hours="24" class="range-btn bg-blue-600 px-3 py-2 rounded text-sm font-semibold">24h</button>
          <button data-hours="48" class="range-btn bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-sm">48h</button>
        </div>
      </div>
    </div>

    <!-- Status banner -->
    <div id="statusBanner" class="hidden mb-4 p-4 rounded-lg text-sm"></div>

    <!-- Charts -->
    <div id="chartsWrap" class="hidden space-y-6">

      <!-- Player count chart -->
      <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
        <h2 class="text-xl font-bold mb-4">👥 Player Count</h2>
        <canvas id="playerChart" height="100"></canvas>
      </div>

      <!-- CPU + Memory chart -->
      <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
        <h2 class="text-xl font-bold mb-4">⚙️ CPU & Memory Usage</h2>
        <canvas id="resourceChart" height="100"></canvas>
      </div>

    </div>

    <!-- Empty state -->
    <div id="emptyState" class="bg-gray-800 p-8 rounded-lg text-center text-gray-400 border border-gray-700">
      Select a server above to view performance statistics.
    </div>

  </div>
  <script src="/js/serverStats.js"></script>
</body>
</html>
