<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log - DayZ Dashboard</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <script src="/js/instance-config.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="container mx-auto p-6 max-w-7xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-4xl font-bold">📋 Service Activity Log</h1>
      <a href="/dashboard" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">← Back</a>
    </div>


    <!-- Server selector -->
    <div class="bg-gray-800 p-4 rounded-lg mb-6 border border-gray-700">
      <label class="block mb-2 font-semibold">Select Server</label>
      <select id="serverSelect" class="bg-gray-700 p-2 rounded w-full max-w-sm">
        <option value="">Loading servers…</option>
      </select>
    </div>

    <!-- Status banner -->
    <div id="statusBanner" class="hidden mb-4 p-4 rounded-lg text-sm" role="status" aria-live="polite"></div>

    <!-- Log table area -->
    <div id="logWrap">
      <p class="text-gray-400">Select a server to view its activity log.</p>
    </div>

  </div>
  <script src="/js/activityLog.js"></script>
</body>
</html>
