<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager - DayZ Dashboard</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <script src="/js/instance-config.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="container mx-auto p-6 max-w-7xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-4xl font-bold">🕒 Scheduled Task Manager</h1>
      <a href="/dashboard" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">← Back</a>
    </div>

    <!-- Dashboard Navigation -->
    <nav class="bg-gray-800 rounded-lg p-3 mb-6 border border-gray-700">
      <div class="flex gap-2 flex-wrap">
        <a href="/dashboard" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🎮 Servers</a>
        <a href="/dashboard/economy" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">💰 Economy</a>
        <a href="/map" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🗺️ Map</a>
        <a href="/dashboard/feeds" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">📢 Feeds</a>
        <a href="/dashboard/automation" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">⚙️ Automation</a>
        <a href="/dashboard/tasks" class="bg-blue-600 px-4 py-2 rounded font-semibold">🕒 Tasks</a>
        <a href="/dashboard/server-control" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🎮 Control</a>
        <a href="/dashboard/backups" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">💾 Backups</a>
        <a href="/dashboard/rotation" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🔄 Rotation</a>
        <a href="/dashboard/ai-assistant" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🤖 AI</a>
        <a href="/dashboard/server-stats" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">📊 Stats</a>
        <a href="/dashboard/activity-log" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">📋 Activity</a>
        <a href="/dashboard/console" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🖥️ Console</a>
        <a href="/dashboard/boost" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🚀 Boost</a>
        <a href="/dashboard/support" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🎫 Support</a>
        <a href="/dashboard/settings" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🔧 Settings</a>
        <a href="/player-portal" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">👤 Player Portal</a>
        <a href="/dashboard/shop-admin" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">🛒 Shop</a>
      </div>
    </nav>

    <!-- Server selector -->
    <div class="bg-gray-800 p-4 rounded-lg mb-6 border border-gray-700">
      <label class="block mb-2 font-semibold">Select Server</label>
      <select id="serverSelect" class="bg-gray-700 p-2 rounded w-full max-w-sm">
        <option value="">Loading servers…</option>
      </select>
    </div>

    <!-- Error / status banner -->
    <div id="statusBanner" class="hidden mb-4 p-4 rounded-lg text-sm"></div>

    <!-- Current tasks table -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Current Tasks</h2>
        <button id="refreshBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">🔄 Refresh</button>
      </div>
      <div id="tasksTableWrap">
        <p class="text-gray-400">Select a server to view tasks.</p>
      </div>
    </div>

    <!-- Add / edit task form -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold mb-4" id="formTitle">➕ Add Task</h2>

      <!-- Hidden field for edit mode -->
      <input type="hidden" id="editTaskId" value="">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block mb-1 text-sm font-semibold">Task Type</label>
          <select id="taskType" class="bg-gray-700 p-2 rounded w-full">
            <option value="">Select a server first…</option>
          </select>
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Minute <span class="text-gray-400 font-normal">(0–59 or *)</span></label>
          <input id="taskMinute" type="text" value="0" class="bg-gray-700 p-2 rounded w-full" placeholder="0">
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Hour <span class="text-gray-400 font-normal">(0–23, */4, 0,6,12,18, etc.)</span></label>
          <input id="taskHour" type="text" value="*" class="bg-gray-700 p-2 rounded w-full" placeholder="*">
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Day of Month <span class="text-gray-400 font-normal">(1–31 or *)</span></label>
          <input id="taskDay" type="text" value="*" class="bg-gray-700 p-2 rounded w-full" placeholder="*">
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Month <span class="text-gray-400 font-normal">(1–12 or *)</span></label>
          <input id="taskMonth" type="text" value="*" class="bg-gray-700 p-2 rounded w-full" placeholder="*">
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Weekday <span class="text-gray-400 font-normal">(0=Sun…6=Sat or *)</span></label>
          <input id="taskWeekday" type="text" value="*" class="bg-gray-700 p-2 rounded w-full" placeholder="*">
        </div>
      </div>

      <!-- Quick-schedule presets -->
      <div class="mb-4">
        <p class="text-sm text-gray-400 mb-2">Quick presets:</p>
        <div class="flex flex-wrap gap-2">
          <button data-preset-hour="*/4" data-preset-minute="0" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Every 4 h</button>
          <button data-preset-hour="*/6" data-preset-minute="0" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Every 6 h</button>
          <button data-preset-hour="0,6,12,18" data-preset-minute="0" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">4× daily (0/6/12/18)</button>
          <button data-preset-hour="0,8,16" data-preset-minute="0" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">3× daily (0/8/16)</button>
          <button data-preset-hour="0,12" data-preset-minute="0" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">2× daily (0/12)</button>
          <button data-preset-hour="3" data-preset-minute="0" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Daily at 03:00</button>
        </div>
      </div>

      <div class="flex gap-3">
        <button id="saveBtn" class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded font-semibold">Save Task</button>
        <button id="cancelEditBtn" class="hidden bg-gray-600 hover:bg-gray-700 px-5 py-2 rounded">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/taskManager.js"></script>
</body>
</html>
