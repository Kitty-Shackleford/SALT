<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Player Reports - Admin Panel</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }

    .badge-open       { background: #dc2626; color: #fff; }
    .badge-resolved   { background: #16a34a; color: #fff; }
    .badge-dismissed  { background: #6b7280; color: #fff; }

    .tab-btn.active   { background: #3b82f6; font-weight: 700; }
  </style>
  <script src="/js/instance-config.js" defer></script>
</head>
<body class="bg-gray-900 text-white">
  <div class="container mx-auto p-6 max-w-7xl">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-4xl font-bold">📋 Player Reports</h1>
      <div class="flex gap-2">
        <a href="/admin" class="bg-orange-600 hover:bg-orange-700 px-4 py-2 rounded">← Admin Dashboard</a>
        <a href="/logout" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded">Logout</a>
      </div>
    </div>

    <!-- Admin Navigation -->
    <nav class="bg-gray-800 rounded-lg p-4 mb-6">
      <div class="flex gap-2 flex-wrap">
        <a href="/admin" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Dashboard</a>
        <a href="/admin/guilds" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Discord Communities</a>
        <a href="/admin/guilds-approval" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Guild Approval</a>
        <a href="/admin/servers" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">All Servers</a>
        <a href="/admin/users" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Users</a>
        <a href="/admin/audit" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Audit Log</a>
        <a href="/admin/reports" class="bg-orange-600 px-4 py-2 rounded font-semibold">Reports</a>
      </div>
    </nav>

    <!-- Controls: guild + status filter tabs -->
    <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 mb-6">
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
        <div>
          <label class="text-sm text-gray-400 mr-2">Community:</label>
          <select id="guildSelect" class="bg-gray-700 px-3 py-2 rounded focus:ring-2 focus:ring-orange-500 outline-none">
            <option value="">All communities</option>
          </select>
        </div>
        <!-- Status filter tabs -->
        <div class="flex gap-2">
          <button class="tab-btn active px-4 py-2 rounded bg-gray-700" data-status="all">All</button>
          <button class="tab-btn px-4 py-2 rounded bg-gray-700" data-status="open">Open</button>
          <button class="tab-btn px-4 py-2 rounded bg-gray-700" data-status="resolved">Resolved</button>
          <button class="tab-btn px-4 py-2 rounded bg-gray-700" data-status="dismissed">Dismissed</button>
        </div>
      </div>
    </div>

    <!-- Reports table -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-700">
            <tr>
              <th class="px-4 py-3 text-left text-gray-300">#</th>
              <th class="px-4 py-3 text-left text-gray-300">Reporter</th>
              <th class="px-4 py-3 text-left text-gray-300">Reported Player</th>
              <th class="px-4 py-3 text-left text-gray-300">Reason</th>
              <th class="px-4 py-3 text-left text-gray-300">Evidence</th>
              <th class="px-4 py-3 text-left text-gray-300">Status</th>
              <th class="px-4 py-3 text-left text-gray-300">Submitted</th>
              <th class="px-4 py-3 text-left text-gray-300">Actions</th>
            </tr>
          </thead>
          <tbody id="reports-body">
            <tr>
              <td colspan="8" class="text-center py-10">
                <div class="spinner border-4 border-orange-600 border-t-transparent rounded-full w-10 h-10 mx-auto mb-3"></div>
                <p class="text-gray-400">Loading reports…</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Resolve Modal -->
  <div id="resolveModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-lg w-full mx-4">
      <h2 class="text-2xl font-bold mb-4">✅ Resolve Report</h2>
      <p class="text-gray-300 mb-4">Optionally add a resolution note for this report:</p>
      <textarea id="resolveNote" rows="4" placeholder="Resolution note (optional)…"
                class="w-full bg-gray-700 p-3 rounded focus:ring-2 focus:ring-green-500 outline-none mb-4 text-sm"></textarea>
      <div class="flex gap-3">
        <button id="resolveConfirmBtn"
                class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-semibold flex-1">
          ✅ Confirm Resolve
        </button>
        <button id="resolveCloseBtn"
                class="bg-gray-600 hover:bg-gray-700 px-6 py-2 rounded font-semibold">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/csrf-helper.js"></script>
  <script src="/js/admin-reports.js"></script>
</body>
</html>
